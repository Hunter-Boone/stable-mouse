name: Build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-svg-dev libevdev-dev
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'Linux'
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        working-directory: build
        run: cpack -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: stable-mouse-${{ runner.os }}-${{ runner.arch }}-preview
          path: |
            build/*.exe
            build/*.dmg
            build/*.deb
          if-no-files-found: error
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive corresponding source
        run: git archive --format=tar.gz --prefix=stable-mouse/ -o stable-mouse-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: stable-mouse-source
          path: stable-mouse-source.tar.gz
