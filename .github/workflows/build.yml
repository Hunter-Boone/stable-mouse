name: Build and package
on:
  push:
    paths-ignore: ['website/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-svg-dev libevdev-dev
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'Linux'
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure universal macOS app
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        env:
          STABLE_MOUSE_TEST_NATIVE_INPUT: '1'
          STABLE_MOUSE_TEST_CENTER: '1'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Capture Windows interface
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & build/Release/stable-mouse.exe --screenshot "$env:RUNNER_TEMP/stable-mouse-interface.png"
      - name: Package
        working-directory: build
        run: cpack -C Release
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $installer = Get-ChildItem build/*.exe | Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP 'stable-mouse-installed'
          $installed = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Installer failed' }
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '[\\/]Qt[\\/]' }) -join ';'
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $app = Join-Path $installRoot 'bin/stable-mouse.exe'
          $process = Start-Process $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed app failed to launch' }
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          image_dir="$RUNNER_TEMP/stable-mouse-image"
          hdiutil attach build/*.dmg -nobrowse -mountpoint "$image_dir"
          trap 'hdiutil detach "$image_dir"' EXIT
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u QT_QPA_PLATFORM "$image_dir/stable-mouse.app/Contents/MacOS/stable-mouse" --smoke-test
          lipo "$image_dir/stable-mouse.app/Contents/MacOS/stable-mouse" -verify_arch arm64 x86_64
          test -f "$image_dir/stable-mouse.app/Contents/Resources/doc/LICENSE"
      - name: Verify Debian package
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: |
          python3 tests/check_deb.py build/*.deb
          dpkg-deb -x build/*.deb "$RUNNER_TEMP/stable-mouse-installed"
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/stable-mouse-installed/usr/bin/stable-mouse" --smoke-test
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: stable-mouse-Windows-test-tools
          path: |
            build/Release/windows_backend_tests.exe
            build/Release/windows_focus_tests.exe
            build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/stable-mouse-interface.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stable-mouse-${{ runner.os }}-${{ runner.arch }}-preview
          path: |
            build/*.exe
            build/*.dmg
            build/*.deb
          if-no-files-found: error
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive corresponding source
        run: git archive --format=tar.gz --prefix=stable-mouse/ -o stable-mouse-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: stable-mouse-source
          path: stable-mouse-source.tar.gz
